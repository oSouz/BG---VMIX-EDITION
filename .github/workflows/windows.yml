name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime and HTTP regression tests
        run: npm test
      - name: Verify original source baseline
        run: python baseline/Souz-BG-Studio-main/tools/verify_release.py
      - name: Build and check source distribution
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/*.zip
